<!DOCTYPE html>
<html lang="en">
<head>
    <title>Playing Quiz | Mathoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="card" style="margin-top: 50px;">
    <div id="quiz-box">
        <h2 id="question">Question</h2>
        <div id="answers"></div>
        <p id="progress"></p>
    </div>
</section>

<script>
const quizzes = {
    algebra: [
        { q: "Solve: x + 2 = 5", a: ["1", "2", "3", "4"], correct: "3" },
        { q: "x² = 9, x = ?", a: ["1", "3", "-3", "±3"], correct: "±3" }
    ],
    statistics: [
        { q: "Mean of 2, 4, 6?", a: ["4", "5", "6", "3"], correct: "4" }
    ],
    geometry: [
        { q: "Circle area formula?", a: ["πr²", "2πr", "r²", "πd"], correct: "πr²" }
    ]
};

let currentQuiz = [];
let index = 0;
let score = 0;

// Când se încarcă pagina, verificăm ce quiz a fost selectat în tab-ul principal
window.onload = function() {
    const type = localStorage.getItem("selectedQuiz");
    
    if (type && quizzes[type]) {
        currentQuiz = quizzes[type];
        showQuestion();
    } else {
        document.getElementById("quiz-box").innerHTML = "<h2>Eroare: Quiz-ul nu a fost găsit!</h2>";
    }
};

function showQuestion() {
    const q = currentQuiz[index];
    document.getElementById("question").innerText = q.q;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.a.forEach(ans => {
        const btn = document.createElement("button");
        btn.innerText = ans;
        btn.style = `
            display:block;
            margin:10px 0;
            padding:10px;
            border:none;
            border-radius:8px;
            background:#826aed;
            color:white;
            cursor:pointer;
            width: 100%;
        `;
        btn.onclick = () => checkAnswer(ans);
        answersDiv.appendChild(btn);
    });

    document.getElementById("progress").innerText = `Question ${index + 1} / ${currentQuiz.length}`;
}

function checkAnswer(ans) {
    if (ans === currentQuiz[index].correct) {
        score++;
    }
    index++;

    if (index < currentQuiz.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-box").innerHTML = `
        <h2>Quiz Finished 🎉</h2>
        <p>Your score: ${score} / ${currentQuiz.length}</p>
        <button onclick="window.close()" style="padding:10px; border-radius:8px; cursor:pointer;">Close Tab</button>
    `;
}
</script>

</body>
</html>
