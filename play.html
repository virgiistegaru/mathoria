<!DOCTYPE html>
<html lang="en">
<head>
    <title>Playing Quiz | Mathoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="card" style="margin-top: 50px;">
    <div id="quiz-box">
        <h2 id="question">Question</h2>
        <div id="answers"></div>
        <p id="feedback"></p>
        <p id="explanation"></p>
        <p id="progress"></p>
    </div>
</section>

<script>
    const quizzes = {
            algebra: [
                {
                    q: "Solve: x + 2 = 5",
                    a: ["1", "2", "3", "4"],
                    correct: "3",
                    explanation: "Subtract 2 from both sides: x = 3."
                },
                {
                    q: "x² = 9, x = ?",
                    a: ["1", "3", "-3", "±3"],
                    correct: "±3",
                    explanation: "Both 3 and -3 squared give 9."
                }
],

                calculus: [
                    {
                        q: "What is the derivative of f(x) = x²?",
                        a: ["2x", "x", "x³", "1"],
                        correct: "2x",
                        explanation: "Using power rule: f'(x) = 2x."
                    },
                    {
                        q: "What is the integral of f(x) = 3x²?",
                        a: ["x³ + C", "3x³ + C", "x³/3 + C", "9x + C"],
                        correct: "x³ + C",
                        explanation: "Using power rule for integration: F(x) = x³ + C."
                    }
],

            geometry: [
                {
                    q: "What is the area of a circle with radius 3?",
                    a: ["9π", "6π", "3π", "12π"],
                    correct: "9π",
                    explanation: "Area = πr² = π(3)² = 9π."
                },
                {
                    q: "A triangle has sides of length 3, 4, and 5. What type of triangle is it?",
                    a: ["Equilateral", "Isosceles", "Scalene", "Right"],
                    correct: "Right",
                    explanation: "It satisfies the Pythagorean theorem (3² + 4² = 5²)."
                }
]
    };

let currentQuiz = [];
let index = 0;
let score = 0;

window.onload = function() {
    const type = localStorage.getItem("selectedQuiz");
    
    if (type && quizzes[type]) {
        currentQuiz = quizzes[type];
        showQuestion();
    } else {
        document.getElementById("quiz-box").innerHTML = "<h2>Eroare: Quiz-ul nu a fost găsit!</h2>";
    }
};

function showQuestion() {
    const q = currentQuiz[index];
    document.getElementById("question").innerText = q.q;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.a.forEach(ans => {
        const btn = document.createElement("button");
        btn.innerText = ans;
        btn.style = `
            display:block;
            margin:10px 0;
            padding:10px;
            border:none;
            border-radius:8px;
            background:#826aed;
            color:white;
            cursor:pointer;
            width: 100%;
        `;
        btn.onclick = () => checkAnswer(ans);
        answersDiv.appendChild(btn);
    });

    document.getElementById("progress").innerText = `Question ${index + 1} / ${currentQuiz.length}`;
}
function checkAnswer(ans) {

    const q = currentQuiz[index];

    const feedback = document.getElementById("feedback");
    const explanation = document.getElementById("explanation");

    const buttons = document.querySelectorAll("#answers button");

    buttons.forEach(btn => {
        btn.disabled = true;

        if (btn.innerText === q.correct) {
            btn.style.background = "#7ae07a";
        }

        if (btn.innerText === ans && ans !== q.correct) {
            btn.style.background = "#ff6b6b";
        }
    });

    if (ans === q.correct) {

        score++;

        feedback.innerText = "✔ Correct!";
        feedback.style.color = "green";

    } else {

        feedback.innerText = "❌ Wrong!";
        feedback.style.color = "red";
    }

    explanation.innerText = "Explanation: " + q.explanation;

    setTimeout(() => {

        index++;

        feedback.innerText = "";
        explanation.innerText = "";

        if (index < currentQuiz.length) {
            showQuestion();
        } else {
            showResult();
        }

    }, 2000);
}

function showResult() {
    document.getElementById("quiz-box").innerHTML = `
        <h2>Quiz Finished 🎉</h2>
        <p>Your score: ${score} / ${currentQuiz.length}</p>
        <button class="close-btn" onclick="window.close()">
            Close Tab
        </button>
    `;
}
</script>

</body>
</html>
