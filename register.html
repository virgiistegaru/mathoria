<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register | Mathoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">

    <div class="logo">
        <a href="/">
        <img class="logo-image" src="assets/logo.png" alt="Mathoria Logo" href="index.html">
        </a>
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="lessons.html">Lessons</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
    </ul>

</nav>

<section class="register-page">

    <div class="register-card">

        <h1>Mathoria</h1>

        <h2>Join us today!</h2>

        <h3>Create an account to access interactive lessons, quizzes and progress tracking.</h3>

        <form id="registerForm">

    <input 
        type="text" 
        id="registerName"
        placeholder="Enter your name"
        required
    >

    <input 
        type="email" 
        id="registerEmail"
        placeholder="Enter your email"
        required
    >

    <input
        type="number"
        id="registerPhone"
        placeholder="Enter your phone number"
        required
    >

    <input 
        type="password" 
        id="registerPassword"
        placeholder="Enter your password"
        minlength="8"
        required
    >
    
    <input 
        type="password" 
        id="registerConfirmPassword"
        placeholder="Confirm your password"
        minlength="8"
        required
    >

    <button type="submit">
        Register
    </button>


            <h4>Already have an account? <a href="login.html">Login here</a></h4>

        </form>
    </div>
</section>
<script src="register.js"></script>
</body>
</html>
