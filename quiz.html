<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quiz | Mathoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">

    <div class="logo">
        <a href="/">
        <img class="logo-image" src="assets/logo.png" alt="Mathoria Logo" href="index.html">
        </a>
    </div>

    <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="lessons.html">Lessons</a></li>
    <li><a href="quiz.html">Quiz</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li class="auth"></li>
    </ul>

<script src="logout.js"></script>

</nav>

<section class="card">
  <h2>Quizzes 🧠</h2>

  <div class="quiz-container">

    <div class="quiz-card">
      <h3>Algebra Basics</h3>
      <p>10 questions • Easy</p>
      <button onclick="startQuiz('algebra')">Start</button>
    </div>

    <div class="quiz-card">
      <h3>Normal Distribution</h3>
      <p>15 questions • Medium</p>
      <button onclick="startQuiz('statistics')">Start</button>
    </div>

    <div class="quiz-card">
      <h3>Geometry - Circles</h3>
      <p>12 questions • Hard</p>
      <button onclick="startQuiz('geometry')">Start</button>
    </div>

    <div id="quiz-box" style="display:none; margin-top:20px;" class="card">
  <h2 id="question">Question</h2>

  <div id="answers"></div>

  <p id="progress"></p>
</div>

  </div>
</section>

<script>
    function startQuiz(type) {
        localStorage.setItem("selectedQuiz", type);
        window.open("play.html", "_blank");
    }
    </script>

<script src="logout.js"></script>
<script src="auth.js"></script>
<script src="guard.js"></script>

</body>
</html>
